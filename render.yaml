# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: offentlig
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # Én worker, så cachen deles; tråde så de tre selskaber kan hentes samtidig.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_DEBUG
        value: "0"
